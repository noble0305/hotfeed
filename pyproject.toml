[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotfeed"
version = "0.1.0"
description = "Aggregate hot topics from V2EX / linux.do and other community sites"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    'tomli>=2.0; python_version < "3.11"',
]

[project.scripts]
hotfeed = "hotfeed.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
